<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Choices Counselor</title>
<!--
  Website front end for the choices-counselor agent (website option 1). Every message goes to
  POST <agent>/chat on the same Fetch.ai agent ASI:One talks to; card clicks send the card's
  selection JSON, like an ASI:One click. No build step: open this file, or serve web/ statically.
  Agent URL: ?agent=https://host:port (remembered), default http://localhost:8000.
-->
<style>
  :root {
    --bg: #f6f4ef; --panel: #ffffff; --ink: #1d2433; --muted: #5f6b7d; --line: #e3e0d8;
    --accent: #1f5fbf; --accent-ink: #ffffff; --user: #1f5fbf; --user-ink: #ffffff;
    --bot: #ffffff; --warn: #fff6e0; --radius: 14px;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #11151c; --panel: #1a202a; --ink: #e8ecf2; --muted: #9aa5b5; --line: #2a3240;
      --accent: #6aa3ff; --accent-ink: #0b1220; --user: #2d5fa8; --user-ink: #ffffff;
      --bot: #1a202a; --warn: #2b2614;
    }
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    background: var(--bg); color: var(--ink);
    font: 16px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    display: flex; flex-direction: column;
  }
  header {
    display: flex; align-items: center; gap: 12px; padding: 12px 16px;
    border-bottom: 1px solid var(--line); background: var(--panel);
  }
  header h1 { font-size: 17px; margin: 0; flex: 1; }
  header small { display: block; color: var(--muted); font-weight: 400; font-size: 13px; }
  button {
    font: inherit; border-radius: 999px; border: 1px solid var(--line); background: var(--panel);
    color: var(--ink); padding: 7px 14px; cursor: pointer;
  }
  button.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
  button:disabled { opacity: .5; cursor: default; }
  main { flex: 1; overflow-y: auto; padding: 16px; }
  .log { max-width: 760px; margin: 0 auto; display: flex; flex-direction: column; gap: 12px; }
  .msg { max-width: 88%; padding: 10px 14px; border-radius: var(--radius); overflow-wrap: anywhere; }
  .msg.user { align-self: flex-end; background: var(--user); color: var(--user-ink); border-bottom-right-radius: 4px; }
  .msg.bot { align-self: flex-start; background: var(--bot); border: 1px solid var(--line); border-bottom-left-radius: 4px; }
  .msg p { margin: 0 0 8px; } .msg p:last-child { margin: 0; }
  .msg ul { margin: 4px 0 8px; padding-left: 20px; }
  .msg a { color: var(--accent); }
  .msg.user a { color: inherit; }
  .card { margin-top: 10px; border: 1px solid var(--line); border-radius: 12px; padding: 12px; background: var(--bg); }
  .card h3 { margin: 0 0 4px; font-size: 15px; }
  .card .sub { color: var(--muted); font-size: 14px; margin-bottom: 8px; }
  .items { display: grid; gap: 8px; }
  .item { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 10px; }
  .item b { display: block; }
  .item .sub { margin: 2px 0 8px; }
  .rows { display: grid; grid-template-columns: minmax(90px, auto) 1fr; gap: 4px 12px; font-size: 14px; margin: 6px 0 10px; }
  .rows dt { color: var(--muted); } .rows dd { margin: 0; }
  .ctas { display: flex; flex-wrap: wrap; gap: 8px; }
  form.card label { display: block; font-size: 14px; margin: 8px 0 4px; }
  form.card input[type=text], form.card input[type=number], form.card select {
    width: 100%; font: inherit; padding: 8px; border-radius: 8px; border: 1px solid var(--line);
    background: var(--panel); color: var(--ink);
  }
  form.card .check { display: flex; align-items: center; gap: 8px; }
  form.card .check label { margin: 0; }
  .typing { color: var(--muted); font-style: italic; }
  .starters { display: flex; flex-wrap: wrap; gap: 8px; }
  .starters button { border-radius: 10px; text-align: left; font-size: 14px; }
  .error { align-self: center; background: var(--warn); border: 1px solid var(--line); font-size: 14px; }
  footer { border-top: 1px solid var(--line); background: var(--panel); padding: 10px 16px; }
  footer form { max-width: 760px; margin: 0 auto; display: flex; gap: 8px; }
  footer textarea {
    flex: 1; font: inherit; resize: none; padding: 9px 12px; border-radius: 12px;
    border: 1px solid var(--line); background: var(--bg); color: var(--ink); max-height: 140px;
  }
  .note { max-width: 760px; margin: 6px auto 0; color: var(--muted); font-size: 12px; }
  @media (max-width: 520px) { .msg { max-width: 96%; } .rows { grid-template-columns: 1fr; } .rows dd { margin-bottom: 6px; } }
</style>
</head>
<body>
<header>
  <h1>Choices Counselor<small>LAUSD Choices help · English / Español</small></h1>
  <button id="reset" type="button">New chat</button>
</header>
<main id="scroll"><div class="log" id="log"></div></main>
<footer>
  <form id="composer">
    <textarea id="input" rows="1" placeholder="Message · Mensaje" aria-label="Message / Mensaje" autocomplete="off"></textarea>
    <button class="primary" id="send" type="submit">Send</button>
  </form>
  <div class="note">Estimates only. Confirm at choices.lausd.net or (213) 241-4177. Don't share private details you don't need to.</div>
</footer>
<script>
(() => {
  const params = new URLSearchParams(location.search);
  const store = {
    get(k) { try { return localStorage.getItem(k); } catch { return null; } },
    set(k, v) { try { localStorage.setItem(k, v); } catch {} },
  };
  if (params.get("agent")) store.set("agent", params.get("agent"));
  const AGENT = (store.get("agent") || "http://localhost:8000").replace(/\/+$/, "");
  const STARTERS = [
    "Hi, I'm Maria. We live in Boyle Heights. My son Diego is in 5th grade and has an IEP. He loves art and drawing. Which schools do you recommend?",
    "Hola, soy Maria. Vivo en Boyle Heights. Mi hijo Diego está en quinto grado y tiene un IEP. Le encanta el arte. ¿Qué escuelas me recomienda?",
  ];
  const WELCOME = {
    en: "Hello! I'm the LAUSD Choices counselor. Tell me about your child — grade, interests, neighborhood — and I'll suggest Choices programs.",
    es: "¡Hola! Soy el consejero de Choices de LAUSD. Cuénteme de su hijo o hija — grado, intereses, vecindario — y le sugiero programas de Choices.",
  };

  const log = document.getElementById("log");
  const scroller = document.getElementById("scroll");
  const input = document.getElementById("input");
  const sendBtn = document.getElementById("send");
  let session = newSession();
  let busy = false;

  function newSession() {
    return (crypto.randomUUID ? crypto.randomUUID() : String(Date.now()) + "-" + Math.random().toString(16).slice(2));
  }

  function el(tag, attrs = {}, ...kids) {
    const n = document.createElement(tag);
    for (const [k, v] of Object.entries(attrs)) {
      if (k === "class") n.className = v; else if (k.startsWith("on")) n.addEventListener(k.slice(2), v); else n.setAttribute(k, v);
    }
    for (const kid of kids) if (kid != null) n.append(kid);
    return n;
  }

  // Small, safe Markdown: escape first, then **bold**, [text](https://link), "- " bullets, paragraphs.
  function esc(s) { return s.replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c])); }
  function inline(s) {
    return esc(s)
      .replace(/\*\*(.+?)\*\*/g, "<strong>$1</strong>")
      .replace(/\[([^\]]+)\]\((https?:\/\/[^\s)]+)\)/g, '<a href="$2" target="_blank" rel="noopener noreferrer">$1</a>');
  }
  function markdown(text) {
    const out = [];
    for (const block of (text || "").split(/\n{2,}/)) {
      const lines = block.split("\n");
      if (lines.every(l => /^\s*[-•]\s+/.test(l))) {
        out.push("<ul>" + lines.map(l => "<li>" + inline(l.replace(/^\s*[-•]\s+/, "")) + "</li>").join("") + "</ul>");
      } else {
        out.push("<p>" + lines.map(l => /^\s*[-•]\s+/.test(l) ? "• " + inline(l.replace(/^\s*[-•]\s+/, "")) : inline(l)).join("<br>") + "</p>");
      }
    }
    return out.join("");
  }

  function scrollDown() { scroller.scrollTop = scroller.scrollHeight; }

  function addUser(text) { log.append(el("div", { class: "msg user" }, text)); scrollDown(); }
  function addError(text) { log.append(el("div", { class: "msg error" }, text)); scrollDown(); }

  function ctaButton(cta, primary) {
    return el("button", { type: "button", class: (primary || cta.primary) ? "primary" : "", onclick: e => {
      lockCard(e.target);
      send(JSON.stringify(cta.selection), cta.label);
    } }, cta.label);
  }
  function lockCard(node) {
    const card = node.closest(".card");
    if (card) card.querySelectorAll("button, input, select").forEach(b => b.disabled = true);
  }
  function rows(list) {
    const dl = el("dl", { class: "rows" });
    for (const r of list || []) dl.append(el("dt", {}, r.label), el("dd", {}, r.value));
    return dl;
  }

  function renderCard(kind, p) {
    if (kind === "carousel") {
      const items = el("div", { class: "items" });
      for (const it of p.items) {
        items.append(el("div", { class: "item" }, el("b", {}, it.title),
          it.secondary_text ? el("div", { class: "sub" }, it.secondary_text) : null,
          el("div", { class: "ctas" }, ctaButton(it.primary_cta, false))));
      }
      return el("div", { class: "card" }, el("h3", {}, p.title), p.subtitle ? el("div", { class: "sub" }, p.subtitle) : null, items);
    }
    if (kind === "detail") {
      return el("div", { class: "card" }, el("h3", {}, p.title), rows(p.summary_rows),
        el("div", { class: "ctas" }, ...(p.ctas || []).map(c => ctaButton(c))));
    }
    if (kind === "review") {
      return el("div", { class: "card" }, el("h3", {}, p.title), rows(p.summary_rows),
        el("div", { class: "ctas" }, ctaButton(p.approve_cta, true), ctaButton(p.reject_cta)));
    }
    if (kind === "form") {
      const form = el("form", { class: "card" }, el("h3", {}, p.title));
      for (const f of p.fields) {
        const id = "f-" + f.name + "-" + Math.random().toString(16).slice(2, 8);
        if (f.kind === "checkbox") {
          form.append(el("div", { class: "check" }, el("input", { type: "checkbox", id, name: f.name }), el("label", { for: id }, f.label)));
          continue;
        }
        form.append(el("label", { for: id }, f.label + (f.required ? " *" : "")));
        if (f.kind === "select") {
          const sel = el("select", { id, name: f.name }, el("option", { value: "" }, "—"));
          for (const o of f.options) sel.append(el("option", { value: o.value }, o.label));
          if (f.required) sel.required = true;
          form.append(sel);
        } else {
          const inp = el("input", { id, name: f.name, type: f.kind === "number" ? "number" : "text", autocomplete: f.name === "address" ? "street-address" : "off" });
          if (f.required) inp.required = true;
          form.append(inp);
        }
      }
      form.append(el("div", { class: "ctas", style: "margin-top:12px" }, el("button", { type: "submit", class: "primary" }, p.submit_cta.label)));
      form.addEventListener("submit", e => {
        e.preventDefault();
        const values = {};
        for (const f of p.fields) {
          const n = form.elements[f.name];
          values[f.name] = f.kind === "checkbox" ? n.checked : n.value;
        }
        lockCard(form.querySelector("button"));
        // The address goes to the agent once for distance and is dropped there; don't echo it in the chat.
        send(JSON.stringify({ ...p.submit_cta.selection, values }), p.submit_cta.label);
      });
      return form;
    }
    return null;
  }

  function addBot(reply) {
    const box = el("div", { class: "msg bot" });
    if (reply.text) box.insertAdjacentHTML("beforeend", markdown(reply.text));
    if (reply.kind && reply.payload) {
      const card = renderCard(reply.kind, reply.payload);
      if (card) box.append(card);
    }
    log.append(box);
    scrollDown();
  }

  function setBusy(on) {
    busy = on; sendBtn.disabled = on;
    const t = document.getElementById("typing");
    if (on && !t) { log.append(el("div", { class: "msg bot typing", id: "typing" }, "…")); scrollDown(); }
    if (!on && t) t.remove();
  }

  async function send(text, shown) {
    if (busy || !text.trim()) return;
    addUser(shown || text);
    document.querySelector(".starters")?.remove();
    setBusy(true);
    try {
      const res = await fetch(AGENT + "/chat", {
        method: "POST", headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ session_id: session, text }),
      });
      const data = await res.json();
      setBusy(false);
      if (!res.ok || data.error) { addError("Something went wrong. Please try again, or call (213) 241-4177."); return; }
      data.replies.forEach(addBot);
      if (data.language) document.documentElement.lang = data.language;
    } catch {
      setBusy(false);
      addError("Can't reach the counselor at " + AGENT + ". Is the agent running? / No se pudo conectar.");
    }
  }

  function start() {
    log.replaceChildren();
    addBot({ text: WELCOME.en + "\n\n" + WELCOME.es });
    const chips = el("div", { class: "starters" });
    for (const s of STARTERS) chips.append(el("button", { type: "button", onclick: () => send(s) }, s));
    log.append(chips);
    input.focus();
  }

  document.getElementById("composer").addEventListener("submit", e => {
    e.preventDefault();
    const text = input.value; input.value = ""; input.style.height = "";
    send(text);
  });
  input.addEventListener("keydown", e => {
    if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); document.getElementById("composer").requestSubmit(); }
  });
  input.addEventListener("input", () => { input.style.height = "auto"; input.style.height = input.scrollHeight + "px"; });
  document.getElementById("reset").addEventListener("click", () => { session = newSession(); setBusy(false); start(); });

  start();
})();
</script>
</body>
</html>
