# C11 (#42): 30 parent messages a judge might type. Each lists the outcomes that count as
# "handled sensibly" (an honest no-programs reply is sensible outside our coverage).
# Outcomes: matches | ask_grade | no_programs | scope | help
# lang: expected reply language (omit for mixed messages). Run: python scripts/eval_personas.py
- id: maria_es
  say: "Hola, soy Maria. Vivo en Boyle Heights. Mi hijo Diego está en quinto grado y el próximo año entra a sexto. Tiene un IEP y le encanta el arte."
  lang: es
  expect: [matches]
- id: maria_en
  say: "Hi, I'm Maria from Boyle Heights. My son Diego is in 5th grade, has an IEP and loves art."
  lang: en
  expect: [matches]
- id: typos_es
